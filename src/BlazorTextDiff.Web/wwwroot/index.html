<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Try BlazorTextDiff with editable text samples, character highlights, async loading, and large-file rendering examples." />
    <title>BlazorTextDiff Demo</title>
    <base href="/" />
    
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/site.css" rel="stylesheet" />
    <link href="_content/BlazorTextDiff/css/BlazorDiff.css" rel="stylesheet" />
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="loading-container" role="status">
            <div>
                <span class="loading-spinner loading-spinner-lg" aria-hidden="true"></span>
                <p>Loading BlazorTextDiff…</p>
                <small>Preparing the interactive examples.</small>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        <div class="error-content" role="alert">
            <strong>The demo hit an unexpected error.</strong>
            <p>Reload to try again. Text edits in the playground will not be saved.</p>
            <div class="button-row">
                <a href="" class="btn btn-primary reload">Reload demo</a>
                <button type="button" class="btn btn-outline-secondary dismiss">Dismiss</button>
            </div>
        </div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
